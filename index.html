<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALZ GLOBAL CHAT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0e17; color: #e8f0fe; overflow: hidden; }

        /* LOADING */
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0e17; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s, visibility 0.8s; }
        #loading.hide { opacity: 0; visibility: hidden; }
        .loader-logo { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #4a9eff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5 } 50% { opacity: 1 } }
        .loader-bar { width: 200px; height: 4px; background: rgba(74, 158, 255, 0.15); border-radius: 10px; overflow: hidden; }
        .loader-bar div { height: 100%; width: 0; background: linear-gradient(90deg, #4a9eff, #a78bfa); border-radius: 10px; animation: load 2s ease forwards; }
        @keyframes load { to { width: 100% } }
        .loader-text { font-size: 12px; color: #8899bb; margin-top: 16px; letter-spacing: 2px; }

        /* APP */
        #app { display: none; height: 100vh; flex-direction: column; }
        #app.show { display: flex; }
        .header { padding: 16px 24px; background: rgba(13, 4, 5, 0.9); border-bottom: 1px solid rgba(74, 158, 255, 0.15); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; background: linear-gradient(135deg, #4a9eff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .status { font-size: 12px; color: #4ade80; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px 16px; border-radius: 12px; background: rgba(74, 158, 255, 0.1); border: 1px solid rgba(74, 158, 255, 0.2); animation: fadeIn 0.3s; }
        .msg.self { align-self: flex-end; background: linear-gradient(135deg, #4a9eff, #a78bfa); border: none; }
        .msg .name { font-size: 11px; font-weight: 600; color: #4a9eff; margin-bottom: 4px; }
        .msg.self .name { color: rgba(255, 255, 255, 0.7); }
        .msg .text { font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .msg .time { font-size: 10px; color: #8899bb; margin-top: 4px; text-align: right; }
        .msg.self .time { color: rgba(255, 255, 255, 0.6); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
        .input-area { padding: 16px 20px; background: rgba(13, 4, 5, 0.9); border-top: 1px solid rgba(74, 158, 255, 0.15); display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 14px 18px; background: rgba(10, 14, 23, 0.5); border: 1px solid rgba(74, 158, 255, 0.2); border-radius: 12px; color: #e8f0fe; font-size: 14px; outline: none; }
        .input-area input:focus { border-color: #4a9eff; }
        .input-area button { padding: 14px 24px; background: linear-gradient(135deg, #4a9eff, #a78bfa); border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .input-area button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74, 158, 255, 0.3); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(74, 158, 255, 0.3); border-radius: 10px; }
    </style>
</head>
<body>

<div id="loading">
    <div class="loader-logo">FALZ GLOBAL CHAT</div>
    <div class="loader-bar"><div></div></div>
    <div class="loader-text">LOADING...</div>
</div>

<div id="app">
    <div class="header">
        <h1>FALZ GLOBAL CHAT</h1>
        <div class="status">● online</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Kirim</button>
    </div>
</div>

<script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
<script>
    // ============================================
    // KONFIGURASI PUSHER (GANTI PUNYA LO)
    // ============================================
    const PUSHER_KEY = "11b648d3a282898f3c33";         // Ganti dengan 'key' dari dashboard
    const PUSHER_CLUSTER = "ap1"; // Ganti dengan 'cluster' dari dashboard

    // Inisialisasi Pusher
    const pusher = new Pusher(PUSHER_KEY, {
        cluster: PUSHER_CLUSTER,
        forceTLS: true
    });

    // Subscribe ke channel 'global-chat'
    const channel = pusher.subscribe('global-chat');

    // ============================================
    // USER
    // ============================================
    let username = prompt("Masukin nama lo:") || "Anonim";
    if (username.length > 20) username = username.substring(0, 20);

    // ============================================
    // LOADING
    // ============================================
    setTimeout(() => {
        document.getElementById('loading').classList.add('hide');
        document.getElementById('app').classList.add('show');
    }, 2500);

    // ============================================
    // KIRIM PESAN
    // ============================================
    function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;

        const now = new Date();
        const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

        // Kirim ke server backend lo (Node.js/PHP)
        // Sementara, tampilkan pesan sendiri dulu
        fetch('https://7f5ce86738ddb4.lhr.life/api/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: username,
                text: text,
                time: time
            })
        }).catch(() => {
            // Kalo backend gak ada, tampilkan lokal aja
            addMessage({name: username, text: text, time: time}, true);
        });

        input.value = '';
    }

    // ============================================
    // TERIMA PESAN
    // ============================================
    channel.bind('global-message', (data) => {
        if (data.name === username) return;
        addMessage(data, false);
    });

    // ============================================
    // TAMPILKAN PESAN
    // ============================================
    function addMessage(data, isSelf) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'msg';
        if (isSelf) div.classList.add('self');
        
        div.innerHTML = `
            <div class="name">${data.name}</div>
            <div class="text">${escapeHtml(data.text)}</div>
            <div class="time">${data.time}</div>
        `;
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
